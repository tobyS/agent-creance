[pytest]
# The addon's request hook is a coroutine since AC-0069b (it awaits the credential
# broker over a unix socket), so its tests are coroutines too. asyncio_mode=auto
# means an `async def test_…` just runs, with no per-test marker.
asyncio_mode = auto
# Each test gets its own event loop, so a stub broker's server cannot leak into the
# next test.
asyncio_default_fixture_loop_scope = function
