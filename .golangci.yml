# golangci-lint configuration.
#
# golangci-lint bundles many linters behind one command (think PHPStan + ESLint
# in one). Install it with `make tools`, run it with `make lint`. These defaults
# are strict-but-sane for a security-sensitive CLI; relax in code with
# `//nolint:<linter> // reason` comments where genuinely warranted.

run:
  timeout: 3m

linters:
  enable:
    - errcheck      # unchecked errors — important: a swallowed error in a security tool is a real bug
    - govet         # the standard `go vet` suite
    - staticcheck   # the gold-standard static analyzer
    - ineffassign   # assignments that are never used
    - unused        # dead code
    - gofmt         # formatting (gofmt -s)
    - goimports     # import grouping/ordering
    - misspell      # common typos in comments/strings
    - revive        # configurable style linter (golint successor)
    - bodyclose     # HTTP response bodies must be closed — relevant for the registry generators
    - errorlint     # correct error wrapping/comparison (%w, errors.Is/As)

issues:
  # Tests may be a little looser; don't let lint friction discourage them.
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose

linters-settings:
  goimports:
    local-prefixes: github.com/tobyS/agent-creance
